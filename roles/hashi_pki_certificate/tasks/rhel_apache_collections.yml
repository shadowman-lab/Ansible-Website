---
- name: Populate service facts
  ansible.builtin.service_facts:

- name: Generate a certificate with an approle login
  hashicorp.vault.pki_certificate:
    role_name: shadowman-dev
    common_name: "{{ inventory_hostname }}"
    ttl: "{{ hashi_pki_certificate_ttl }}"
    url: "{{ hashi_url }}"
    auth_method: approle
    role_id: "{{ hashi_role_id }}"
    secret_id: "{{ hashi_secret_id }}"
  delegate_to: localhost
  environment:
    REQUESTS_CA_BUNDLE: "{{ lookup('ansible.builtin.env', 'VAULT_CACERT') }}"
  register: cert_data
  when: ansible_facts['services']['httpd.service']['state'] | default('not-found') == "running" or ansible_facts['services']['grafana-server.service']['state'] | default('not-found') == "running" or ansible_facts['services']['prometheus.service']['state'] | default('not-found') == "running" or ansible_facts['services']['Splunkd.service']['state'] | default('not-found') == "running" or ansible_facts['services']['kibana.service']['state'] | default('not-found') == "running"

- name: Deploy Cert for HTTPD
  ansible.builtin.copy:
    content: "{{ cert_data.data.certificate }}"
    dest: /etc/pki/tls/certs/localhost.crt
    owner: root
    group: root
    mode: "0644"
  notify: HTTPD_restart
  when: ansible_facts['services']['httpd.service']['state'] | default('not-found') == "running"

- name: Deploy Key for HTTPD
  ansible.builtin.copy:
    content: "{{ cert_data.data.private_key }}"
    dest: /etc/pki/tls/private/localhost.key
    owner: root
    group: root
    mode: "0400"
  notify: HTTPD_restart
  when: ansible_facts['services']['httpd.service']['state'] | default('not-found') == "running"

- name: Copy Cert for Grafana
  ansible.builtin.copy:
    content: "{{ cert_data.data.certificate }}"
    dest: /etc/grafana/shadowman_cert.cer
    owner: root
    group: root
    mode: "0644"
  notify: Grafana_restart
  when: ansible_facts['services']['grafana-server.service']['state'] | default('not-found') == "running"

- name: Copy Key for Grafana
  ansible.builtin.copy:
    content: "{{ cert_data.data.private_key }}"
    dest: /etc/grafana/shadowman_private.key
    owner: root
    group: root
    mode: "0400"
  notify: Grafana_restart
  when: ansible_facts['services']['grafana-server.service']['state'] | default('not-found') == "running"

- name: Copy Cert for Prometheus and Alertmanager
  ansible.builtin.copy:
    content: "{{ cert_data.data.certificate }}"
    dest: /certs/shadowman_cert.cer
    owner: root
    group: root
    mode: "0644"
  notify: Prometheus_restart
  when: ansible_facts['services']['prometheus.service']['state'] | default('not-found') == "running"

- name: Copy Key for Prometheus and Alertmanager
  ansible.builtin.copy:
    content: "{{ cert_data.data.private_key }}"
    dest: /certs/shadowman_private.key
    owner: root
    group: root
    mode: "0400"
  notify: Prometheus_restart
  when: ansible_facts['services']['prometheus.service']['state'] | default('not-found') == "running"

- name: Copy Cert for Splunk
  ansible.builtin.copy:
    content: "{{ cert_data.data.certificate }}"
    dest: /certs/shadowman_cert.cer
    owner: root
    group: root
    mode: "0644"
  notify: Splunk_restart
  when: ansible_facts['services']['Splunkd.service']['state'] | default('not-found') == "running"

- name: Copy Key for Splunk
  ansible.builtin.copy:
    content: "{{ cert_data.data.private_key }}"
    dest: /certs/shadowman_private.key
    owner: root
    group: root
    mode: "0400"
  notify: Splunk_restart
  when: ansible_facts['services']['Splunkd.service']['state'] | default('not-found') == "running"

- name: Copy Cert for Kibana
  ansible.builtin.copy:
    content: "{{ cert_data.data.certificate }}"
    dest: /certs/shadowman_cert.cer
    owner: root
    group: root
    mode: "0644"
  notify: Kibana_restart
  when: ansible_facts['services']['kibana.service']['state'] | default('not-found') == "running"

- name: Copy Key for Kibana
  ansible.builtin.copy:
    content: "{{ cert_data.data.private_key }}"
    dest: /certs/shadowman_private.key
    owner: root
    group: root
    mode: "0400"
  notify: Kibana_restart
  when: ansible_facts['services']['kibana.service']['state'] | default('not-found') == "running"
