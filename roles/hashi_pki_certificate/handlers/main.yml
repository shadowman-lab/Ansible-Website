---
- name: HTTPD_restart
  ansible.builtin.service:
    name: httpd
    state: restarted
    enabled: true

- name: Grafana_restart
  ansible.builtin.service:
    name: grafana-server
    state: restarted
    enabled: true

- name: Prometheus_restart
  ansible.builtin.service:
    name: prometheus
    state: restarted
    enabled: true

- name: Splunk_restart
  ansible.builtin.service:
    name: Splunkd
    state: restarted
    enabled: true

- name: Kibana_restart
  ansible.builtin.service:
    name: kibana
    state: restarted
    enabled: true

- name: IIS_restart
  ansible.windows.win_service:
    name: W3Svc
    state: restarted
